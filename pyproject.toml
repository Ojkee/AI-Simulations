[project]
name = "AI-Simulations"
version = "0.1.0"
description = "Tool to implement interfaces for simulations and AI models that controls enviroments"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "pygame",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[project.scripts]
ai-simulations = "ai_simulations.__main__:main"
